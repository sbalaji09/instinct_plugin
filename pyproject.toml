[project]
name = "instinct"
version = "0.1.0"
description = "Background-agent tooling for macOS (Messages, Canvas, Claude) exposed over MCP"
readme = "README.md"
authors = [
    { name = "Siddharth Balaji", email = "siddharthbalaji6@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.7.0",
    "httpx>=0.28.1",
    "mcp[cli]>=2.2.0",
    "playwright>=1.63.0",
    "pyobjc-framework-applicationservices>=12.2.2",
    "pyobjc-framework-contacts>=12.2.2",
    "pyobjc-framework-quartz>=12.2.2",
]

[project.scripts]
instinct-mcp = "instinct.server:main"
instinct = "instinct.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "respx>=0.23.1",
]
